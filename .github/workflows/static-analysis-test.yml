  clang-tidy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - 01_unused_function_wrong.c
          - 01_unused_function_right.c
          - 02_shadowing_wrong.c
          - 02_shadowing_right.c
          - 03_dead_store_wrong.c
          - 03_dead_store_right.c
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Run clang-tidy on ${{ matrix.file }}
        run: |
          clang-tidy test-cases/${{ matrix.file }} \
            --checks="-*,clang-diagnostic-*,clang-analyzer-*,bugprone-*,misc-*,readability-*" \
            -- -x c -std=c11 -Wall -Wextra -Wmissing-prototypes -Wshadow -Itest-cases test-cases/${{ matrix.file }}
            
            
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
  
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
  
      - name: Build test cases
        run: |
          gcc -c test-cases/01_unused_function_wrong.c -o /tmp/01.o
          gcc -c test-cases/02_shadowing_wrong.c -o /tmp/02.o
          gcc -c test-cases/03_dead_store_wrong.c -o /tmp/03.o
  
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
