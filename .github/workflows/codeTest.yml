name: Bootloader Testing Workflow

on:  
  push:
    branches:
      - 'feature/**'
#  pull_request:
#    branches:
#      - develop
#  workflow_dispatch:

jobs:
  Run_CPPCheck:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

#    - name: Debugging - List repository contents
#      run: |
#        ls -R  # List all files and folders in the repository
    
    - name: Install Cppcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck

    - name: Run Cppcheck
      run: |
        INCLUDE_DIRS=$(find ./Core/Src -type d | sed 's/^/-I /')  
        cppcheck --enable=all \
          --suppress=missingIncludeSystem \
          --inline-suppr \
          --force \
          ./Core/Src/bootloader ./Core/Src/hwdt ./Core/Src/uart ./Core/Src/main.c \
          -i ./Core/Inc/stm32f7xx_hal_conf.h \
          -i ./Core/Inc/stm32f7xx_it.h  \
          -i ./Drivers \
          -I ./Core/Inc \
          -I ./Drivers/STM32F7xx_HAL_Driver/Inc \
          INCLUDE_DIRS \
          --suppress=missingInclude:./Core/Inc/stm32f7xx_hal* \
          --suppress=missingInclude:./Drivers/* \
          --output-file=cppcheck_results.txt 

  Run_ClangTidy:
    runs-on: ubuntu-latest
    needs: Run_CPPCheck 
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Clang-Tidy
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy

    - name: Run Clang-Tidy (Static Analysis)
      run: |
        # Debug: List .c files to verify they exist
        echo "Checking for .c files:"
        ls ./Core/Src/bootloader/*.c ./Core/Src/hwdt/*.c ./Core/Src/uart/*.c
        
        # Find and analyze all C and header files using a loop
        find ./Core/Src/bootloader ./Core/Src/hwdt ./Core/Src/uart \( -name '*.c' -o -name '*.h' \) \
          -print0 | while IFS= read -r -d '' file; do
            echo "Analyzing file: $file"
            clang-tidy "$file" -checks='*' -p . -header-filter=.* >> clang_tidy_results.txt
          done

        # Analyze main.c separately and append to results
        clang-tidy ./Core/Src/main.c -checks='*' -p . -header-filter=.* >> clang_tidy_results.txt
   
        
#    - name: Run MISRA C Compliance Check
#      run: |
#        # Download MISRA addon for Cppcheck
#        wget https://raw.githubusercontent.com/danmar/cppcheck/main/addons/misra.py
#        cppcheck --addon=misra.py \
#          Src/bootloader Src/hwdt Src/uart Src/main.c

    - name: Upload Results as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: analysis-results
        path: |
          cppcheck_results.txt
          clang_tidy_results.txt